name: Create branch from Notion ticket

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'Notion Ticket ID number (e.g. 12 for PKR-12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create branch and link Notion ticket
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKET_NUMBER: ${{ inputs.ticket_number }}
          NOTION_DATABASE_ID: '38ab2fceca5c80e4ae4affdfda4e4187'
          BRANCH_PREFIX: 'PKR'
        run: python scripts/create_notion_branch.py
