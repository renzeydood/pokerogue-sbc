name: Create branch from Notion ticket

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'Notion page ID (passed by Cloudflare Worker)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: notion-branch-${{ inputs.page_id }}
  cancel-in-progress: false

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create branch and update Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGE_ID: ${{ inputs.page_id }}
          NOTION_DATABASE_ID: '38ab2fceca5c80e4ae4affdfda4e4187'
          BRANCH_PREFIX: 'PKR'
        run: python scripts/create_notion_branch.py
