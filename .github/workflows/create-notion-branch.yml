name: Create branch from Notion ticket
on:
  workflow_dispatch:
    inputs:
      page_id: {description: Notion page ID from Cloudflare, required: true, type: string}
permissions:
  contents: write
concurrency:
  group: notion-branch-${{ inputs.page_id }}
  cancel-in-progress: false
jobs:
  create:
    uses: renzeydood/notion-github-automation/.github/workflows/reusable-create-branch.yml@main
    with:
      page_id: ${{ inputs.page_id }}
      database_id: ${{ vars.NOTION_DATABASE_ID }}
      data_source_id: ${{ vars.NOTION_DATA_SOURCE_ID }}
    secrets:
      notion_token: ${{ secrets.NOTION_TOKEN }}
