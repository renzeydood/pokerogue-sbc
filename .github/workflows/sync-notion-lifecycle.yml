name: Sync Notion GitHub lifecycle
on:
  pull_request:
    types: [opened, reopened, closed]
  delete:
permissions:
  contents: read
concurrency:
  group: notion-lifecycle-${{ github.event.pull_request.head.ref || github.event.ref || github.run_id }}
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    uses: renzeydood/notion-github-automation/.github/workflows/reusable-sync-lifecycle.yml@main
    with:
      database_id: ${{ vars.NOTION_DATABASE_ID }}
      data_source_id: ${{ vars.NOTION_DATA_SOURCE_ID }}
    secrets:
      notion_token: ${{ secrets.NOTION_TOKEN }}
